$schema: https://github.com/Goldziher/ai-rulez/schema/ai-rules-v2.schema.json
agents: []
commands: []
mcp_servers:
    - args:
        - mcp
      command: ai-rulez
      description: AI-Rulez MCP server for configuration management
      name: ai-rulez
metadata:
    description: Comprehensive benchmarking suite for Python document extraction libraries that tests frameworks like Kreuzberg, Unstructured, Docling, MarkItDown, and Extractous against 94 real-world documents across multiple formats (PDF, DOCX, HTML, images) and languages, measuring performance metrics including extraction speed, memory usage, CPU utilization, and success rates with automated CI/CD pipelines and interactive visualization dashboards
    name: python-text-extraction-libraries-benchmarks-2025
    version: 1.0.0
presets:
    - claude
rules:
    - content: All extractors in src/extractors.py must implement the Protocol interface with extract() method returning tuple[str | None, dict[str, Any]]. Use get_extractor() factory for instantiation. Clear Kreuzberg cache before benchmarks with clear_cache_command().
      name: Framework Extraction Protocol
      priority: critical
    - content: Use msgspec for all benchmark result serialization in results/results.json. Validate BenchmarkResult, BenchmarkSummary, and AggregatedResults dataclasses with proper type hints. Never modify test_documents/ content during benchmarks.
      name: Benchmark Data Integrity
      priority: critical
    - content: Use src/profiler.py ResourceProfiler context manager for all extractions. Sample CPU at 100ms intervals, track peak RSS memory. Enforce 1800s timeout per file extraction with asyncio.wait_for or concurrent.futures.
      name: Resource Monitoring
      priority: high
    - content: Run 'uv run pytest tests/unit/' for unit tests and 'uv run pytest tests/integration/' for integration. Use conftest.py fixtures for test data. Mock external framework calls to avoid CI timeouts.
      name: Testing Standards
      priority: high
    - content: All CLI commands in src/cli.py must use click decorators and return proper exit codes. Support --framework, --category, --file-type filters. Output Rich tables for console display, CSV for data export.
      name: CLI Command Structure
      priority: medium
    - content: Use src/docs_generator.py to generate MkDocs markdown. Run 'uv run mkdocs build' to validate. Store framework comparisons in docs/frameworks/, methodology in docs/methodology/. Deploy via GitHub Actions to GitHub Pages.
      name: Documentation Generation
      priority: medium
    - content: Wrap all extractor calls in try-except blocks logging to BenchmarkResult.error field. Continue on extraction failures (return None, {}). Use Framework enum from src/types.py for framework validation.
      name: Error Handling Strategy
      priority: high
    - content: Use msgspec.Struct for all data models requiring serialization. Define proper types using Protocol for extractors. Enable mypy strict mode and use types-psutil, pandas-stubs for external libraries.
      name: Type Safety with msgspec
      priority: critical
    - content: Always use AsyncPerformanceProfiler or profile_performance context managers for benchmarking. Implement 1800s timeouts per file extraction. Clear Kreuzberg cache before benchmarks. Monitor memory with psutil RSS tracking.
      name: Resource Management
      priority: high
    - content: Test all extractors with pytest-asyncio for async variants. Use pytest-timeout with 2min limits per test. Mock external dependencies with pytest-mock. Maintain fixtures in tests/fixtures/ for reproducible results.
      name: Framework Testing
      priority: critical
    - content: Use Rich Console for all user-facing output. Implement Progress bars with SpinnerColumn for long operations. Format tables with rich.table. Never use plain print() statements.
      name: Rich Console Output
      priority: medium
    - content: Return ExtractionStatus enum values (SUCCESS, PARTIAL, FAILED, TIMEOUT, SKIPPED) for all operations. Store error_message in BenchmarkResult. Use try-except with specific exceptions. Track failed_files dict for retry logic.
      name: Error Handling Patterns
      priority: high
    - content: Use ~keep markers for critical logic in docstrings. Generate MkDocs documentation with mkdocs-material. Store benchmark visualizations in results/charts/. Export CSV summaries for external analysis.
      name: Documentation Standards
      priority: low
    - content: Run each framework in separate GitHub Action jobs to prevent conflicts. Use uv for dependency management with extras. Store artifacts for 90 days. Aggregate results from parallel jobs with src.aggregate module.
      name: CI/CD Isolation
      priority: high
    - content: All text extractions must enforce a strict 1800-second timeout per file using asyncio.wait_for() for async or concurrent.futures with timeout for sync operations
      name: Extraction Timeout Enforcement
      priority: high
    - content: Always clear Kreuzberg cache using clear_cache_command() before running any benchmarks to ensure fair performance comparisons across frameworks
      name: Benchmark Cache Management
      priority: high
    - content: Never modify or delete files in test_documents/ directory during benchmark execution - treat all test documents as read-only resources
      name: Test Document Immutability
      priority: high
sections:
    - content: |-
        ## Prerequisites
        - Python 3.13+
        - uv package manager (`curl -LsSf https://astral.sh/uv/install.sh | sh`)
        - 2GB+ free disk space for framework installations

        ## Development Setup
        ```bash
        # Clone and setup
        git clone https://github.com/Goldziher/python-text-extraction-libs-benchmarks.git
        cd python-text-extraction-libs-benchmarks-2025

        # Install base dependencies
        uv sync

        # Install specific frameworks (avoid conflicts)
        uv sync --extra kreuzberg  # Fast, lightweight
        uv sync --extra extractous  # Rust-based
        uv sync --extra unstructured  # Enterprise features
        # Note: docling conflicts with kreuzberg (lxml version)

        # Or install all compatible frameworks
        uv sync --extra all  # Excludes docling
        ```

        ## Running Your First Benchmark
        ```bash
        # Quick test with small documents
        uv run python -m src.cli benchmark --category small --iterations 1

        # Test specific frameworks
        uv run python -m src.cli benchmark --framework kreuzberg_sync,extractous

        # Generate reports from results
        uv run python -m src.cli report --output-format html
        uv run python -m src.cli visualize
        ```

        ## Common Issues
        - **docling + kreuzberg conflict**: Install separately, never together
        - **Memory errors**: Reduce parallel jobs with `--max-workers 2`
        - **Timeouts**: Increase with `--timeout 3600` (default 1800s)
      name: Development Workflow
      priority: high
    - content: "## Adding New Frameworks\n\n### 1. Create Extractor Class\nAdd to `src/extractors.py`:\n```python\nclass YourFrameworkExtractor:\n    def __init__(self, config: Optional[LanguageConfig] = None):\n        self.config = config or LanguageConfig()\n    \n    def extract_text(self, file_path: Path) -> str:\n        # Implementation using your framework\n        pass\n```\n\n### 2. Register Framework\nUpdate `src/types.py`:\n```python\nclass Framework(str, Enum):\n    KREUZBERG_SYNC = \"kreuzberg_sync\"\n    YOUR_FRAMEWORK = \"your_framework\"  # Add here\n```\n\nUpdate `src/extractors.py` factory:\n```python\ndef get_extractor(framework: Framework, ...) -> Any:\n    if framework == Framework.YOUR_FRAMEWORK:\n        return YourFrameworkExtractor(language_config)\n```\n\n### 3. Add Dependencies\nUpdate `pyproject.toml`:\n```toml\n[project.optional-dependencies]\nyour-framework = [\"your-package>=1.0.0\"]\n```\n\n### 4. Configure Format Support\nIf needed, add to `src/config.py`:\n```python\nFRAMEWORK_EXCLUSIONS = {\n    Framework.YOUR_FRAMEWORK: {'.msg', '.eml'}  # Unsupported formats\n}\n```"
      name: Framework Integration Guide
      priority: high
    - content: |-
        ## Local Testing
        ```bash
        # Run unit tests
        uv run pytest tests/unit/ -v

        # Integration tests (includes mkdocs)
        uv run pytest tests/integration/

        # Test specific framework installation sizes
        uv run python -m src.check_installation_sizes

        # Validate benchmark data
        uv run python -m src.cli quality-assess --results-file results/results.json
        ```

        ## Pre-commit Hooks
        ```bash
        # Setup
        uv run pre-commit install --hook-type commit-msg
        uv run pre-commit install

        # Manual run
        uv run pre-commit run --all-files
        ```

        ## GitHub Actions Workflows

        ### `.github/workflows/ci.yml`
        - Triggers: Push to main, PRs
        - Runs: `ruff check`, `mypy src/`, pytest
        - No benchmarks (code quality only)

        ### `.github/workflows/benchmark-by-framework.yml`
        - Triggers: Weekly (Mon 6AM UTC), manual, releases
        - Each framework in isolated job (2hr timeout)
        - Clears Kreuzberg cache before runs
        - Artifacts stored 90 days

        ### `.github/workflows/deploy-docs.yml`
        - Builds MkDocs site from benchmark results
        - Deploys to GitHub Pages
        - Uses `src/docs_generator.py` for dynamic content

        ## Adding New Frameworks
        1. Create extractor in `src/extractors.py`
        2. Add to `Framework` enum in `src/types.py`
        3. Register in `get_extractor()` factory
        4. Add dependencies to `pyproject.toml` extras
        5. Configure exclusions in `src/config.py:FRAMEWORK_EXCLUSIONS`
        6. Test: `uv sync --extra your_framework && uv run python -m src.cli benchmark --framework your_framework`
      name: Testing & CI Integration
      priority: medium
    - content: |-
        ## Core Components

        ### 1. Extractor System (`src/extractors.py`)
        ```python
        # Protocol-based design for framework wrappers
        class TextExtractor(Protocol):
            def extract_text(self, path: Path) -> str: ...
            def extract_text_async(self, path: Path) -> Awaitable[str]: ...
        ```

        Supported extractors:
        - `KreuzbergExtractor` (sync/async variants)
        - `ExtractousExtractor`
        - `UnstructuredExtractor`
        - `MarkItDownExtractor`
        - `DoclingExtractor`

        ### 2. Benchmark Engine (`src/benchmark.py`)
        - Orchestrates extraction with timeout protection (1800s default)
        - Thread pool for sync extractors, asyncio for async
        - Resource monitoring via `src/profiler.py` (50ms intervals)

        ### 3. Data Pipeline
        ```
        test_documents/ (94 files)
            ↓
        benchmark.py (extraction + profiling)
            ↓
        results/results.json (msgspec format)
            ↓
        aggregate.py → results/aggregated_results.json
            ↓
        visualize.py → results/charts/*.png
            ↓
        docs_generator.py → docs/frameworks/*.md
        ```

        ### 4. Output Structure
        - `BenchmarkResult`: Per-file metrics (time, memory, success)
        - `BenchmarkSummary`: Framework aggregates by category
        - `AggregatedResults`: Cross-framework comparisons

        ### 5. Language Detection (`src/extractors.py:get_language_config()`)
        Auto-configures OCR based on filename patterns:
        - `*hebrew*`, `*israel*` → Hebrew OCR
        - `*chinese*`, `*beijing*` → Chinese OCR
        - `*japanese*`, `*jpn*` → Japanese OCR
      name: Benchmark Architecture & Data Flow
      priority: high
