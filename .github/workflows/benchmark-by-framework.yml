name: Comprehensive Benchmark Suite

on:
  release:
    types: [published]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      frameworks:
        description: 'Frameworks to test (comma-separated or "all")'
        required: false
        default: 'all'
        type: string
      iterations:
        description: 'Number of iterations per test'
        required: false
        default: '1'
        type: string

jobs:
  comprehensive-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Cache Python Dependencies
        id: python-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            .venv
          key: python-dependencies-${{ runner.os }}-benchmark-${{ hashFiles('uv.lock') }}
          restore-keys: |
            python-dependencies-${{ runner.os }}-benchmark-

      - name: Checkout Kreuzberg v4 Dev
        uses: actions/checkout@v4
        with:
          repository: Goldziher/kreuzberg
          path: kreuzberg
          ref: main

      - name: Install Dependencies
        shell: bash
        run: |
          # Configure path for Kreuzberg v4 dev in CI environment
          echo 'kreuzberg = { path = "./kreuzberg", editable = true }' >> pyproject.toml

          # Install base package and dev dependencies
          # Install ALL frameworks for comprehensive testing
          uv sync --dev --extra all --extra kreuzberg-dev

      - name: Cache and Install APT Packages
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: tesseract-ocr tesseract-ocr-eng tesseract-ocr-deu tesseract-ocr-fra tesseract-ocr-heb tesseract-ocr-chi-sim tesseract-ocr-jpn tesseract-ocr-kor poppler-utils libmagic1 pandoc
          version: 2.0

      - name: Verify Framework Installations
        run: |
          echo "=== Framework Installation Verification ==="
          uv run python -c "
          import sys
          frameworks = []

          try:
              import kreuzberg
              frameworks.append(f'✅ Kreuzberg: {kreuzberg.__version__}')
              # Test v4 dev availability
              frameworks.append(f'✅ Kreuzberg v4 Dev: Available')
          except ImportError as e:
              frameworks.append(f'❌ Kreuzberg: {e}')
              frameworks.append(f'❌ Kreuzberg v4 Dev: Not available')

          try:
              import extractous
              frameworks.append('✅ Extractous: Available')
          except ImportError as e:
              frameworks.append(f'❌ Extractous: {e}')

          try:
              from unstructured.partition.auto import partition
              frameworks.append('✅ Unstructured: Available')
          except ImportError as e:
              frameworks.append(f'❌ Unstructured: {e}')

          try:
              import markitdown
              frameworks.append(f'✅ MarkItDown: {markitdown.__version__}')
          except ImportError as e:
              frameworks.append(f'❌ MarkItDown: {e}')

          try:
              import docling
              frameworks.append(f'✅ Docling: Available')
          except ImportError as e:
              frameworks.append(f'❌ Docling: {e}')

          for fw in frameworks:
              print(fw)
          "

      - name: Clear Kreuzberg Cache
        run: |
          echo "Clearing Kreuzberg cache directories..."
          rm -rf ~/.kreuzberg .kreuzberg
          echo "Cache cleared"

      - name: Run Comprehensive Benchmark Suite
        continue-on-error: false
        run: |
          # Parse frameworks input
          INPUT_FRAMEWORKS="${{ github.event.inputs.frameworks || 'all' }}"
          ITERATIONS="${{ github.event.inputs.iterations || '1' }}"

          echo "=== Starting Comprehensive Benchmark Suite ==="
          echo "Frameworks: $INPUT_FRAMEWORKS"
          echo "Iterations: $ITERATIONS"
          echo "Testing ALL file sizes including huge documents"
          echo "Quality assessment: ENABLED"
          echo "Memory profiling: ENABLED"

          # Create results directory
          mkdir -p results

          if [ "$INPUT_FRAMEWORKS" = "all" ]; then
            # Test all frameworks including v4 dev variants
            FRAMEWORK_LIST="kreuzberg_sync,kreuzberg_async,kreuzberg_v4_sync,kreuzberg_v4_async,extractous,markitdown,unstructured"

            # Add docling only if it doesn't conflict (test separately due to lxml conflicts)
            echo "Testing frameworks: $FRAMEWORK_LIST"

            uv run python -m src.cli benchmark \
              --framework "$FRAMEWORK_LIST" \
              --iterations "$ITERATIONS" \
              --timeout 1800 \
              --continue-on-error \
              --enable-quality-assessment

          else
            # Test specified frameworks
            uv run python -m src.cli benchmark \
              --framework "$INPUT_FRAMEWORKS" \
              --iterations "$ITERATIONS" \
              --timeout 1800 \
              --continue-on-error \
              --enable-quality-assessment
          fi

      - name: Test Docling Separately
        continue-on-error: true
        run: |
          echo "=== Testing Docling Framework Separately ==="
          echo "Note: Docling tested separately due to potential dependency conflicts"

          # Install docling in a clean environment if possible
          if uv sync --dev --extra docling; then
            uv run python -m src.cli benchmark \
              --framework docling \
              --iterations "${{ github.event.inputs.iterations || '1' }}" \
              --timeout 1800 \
              --continue-on-error \
              --enable-quality-assessment
          else
            echo "⚠️ Docling installation failed - skipping Docling benchmarks"
            mkdir -p results-docling
            echo '{"framework": "docling", "status": "installation_failed", "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}' > results-docling/installation_failure.json
          fi

      - name: Aggregate All Results
        run: |
          echo "=== Aggregating All Benchmark Results ==="

          # Collect all result directories
          RESULT_DIRS=""
          for dir in results*; do
            if [ -d "$dir" ] && [ "$(ls -A "$dir" 2>/dev/null)" ]; then
              RESULT_DIRS="$RESULT_DIRS $dir"
            fi
          done

          if [ -n "$RESULT_DIRS" ]; then
            echo "Aggregating results from: $RESULT_DIRS"
            uv run python -m src.cli aggregate \
              --results-dir $RESULT_DIRS \
              --output-file aggregated-results/aggregated.json
            echo "✅ Results aggregated successfully"
          else
            echo "⚠️ No result directories found"
            mkdir -p aggregated-results
            echo '{"error": "No results to aggregate", "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}' > aggregated-results/aggregated.json
          fi

      - name: Generate Documentation
        run: |
          echo "=== Generating Comprehensive Documentation ==="

          if [ -f "aggregated-results/aggregated.json" ]; then
            uv run python -m src.cli docs \
              --aggregated-file aggregated-results/aggregated.json \
              --docs-dir docs-generated
            echo "✅ Documentation generated"
          else
            echo "⚠️ No aggregated results found - generating minimal documentation"
            mkdir -p docs-generated
            echo "# Benchmark Results\n\nNo benchmark results available for documentation generation." > docs-generated/README.md
          fi

      - name: Generate Reports
        run: |
          echo "=== Generating Comprehensive Reports ==="
          mkdir -p final-reports

          if [ -f "aggregated-results/aggregated.json" ]; then
            # Generate all report formats
            uv run python -m src.cli report \
              --aggregated-file aggregated-results/aggregated.json \
              --output-dir final-reports \
              --output-format markdown

            uv run python -m src.cli report \
              --aggregated-file aggregated-results/aggregated.json \
              --output-dir final-reports \
              --output-format html

            uv run python -m src.cli report \
              --aggregated-file aggregated-results/aggregated.json \
              --output-dir final-reports \
              --output-format json

            echo "✅ All report formats generated"
          else
            echo "⚠️ No aggregated results - creating placeholder reports"
            echo "# Benchmark Results\n\nNo results available for reporting." > final-reports/benchmark_report.md
            echo '{"error": "No results available"}' > final-reports/benchmark_report.json
          fi

      - name: Generate Visualizations
        run: |
          echo "=== Generating Comprehensive Visualizations ==="
          mkdir -p final-visualizations

          if [ -f "aggregated-results/aggregated.json" ]; then
            uv run python -m src.cli visualize \
              --results-file aggregated-results/aggregated.json \
              --output-dir final-visualizations
            echo "✅ Visualizations generated"
          else
            echo "⚠️ No aggregated results - creating placeholder"
            echo '{"error": "No visualizations available"}' > final-visualizations/placeholder.json
          fi

      - name: Run Quality Assessment
        run: |
          echo "=== Running Quality Assessment Analysis ==="
          mkdir -p quality-analysis

          # Find all results files for quality assessment
          RESULTS_FILES=""
          for file in results*/results.json aggregated-results/aggregated.json; do
            if [ -f "$file" ]; then
              RESULTS_FILES="$RESULTS_FILES --results-file $file"
            fi
          done

          if [ -n "$RESULTS_FILES" ]; then
            uv run python -m src.cli quality-assess \
              $RESULTS_FILES \
              --output-dir quality-analysis
            echo "✅ Quality assessment completed"
          else
            echo "⚠️ No results files found for quality assessment"
            echo '{"error": "No results for quality assessment"}' > quality-analysis/placeholder.json
          fi

      - name: Create Comprehensive Summary
        run: |
          echo "## 📊 Comprehensive Benchmark Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Count total files processed
          TOTAL_FILES=0
          SUCCESSFUL_FILES=0
          FAILED_FILES=0

          if [ -d "results" ]; then
            echo "### Framework Performance Overview" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # Analyze results files
            for file in results*/results.json; do
              if [ -f "$file" ]; then
                FRAMEWORK=$(basename $(dirname "$file"))
                echo "📁 **$FRAMEWORK Results Found**" >> $GITHUB_STEP_SUMMARY
              fi
            done

            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Key Features Tested" >> $GITHUB_STEP_SUMMARY
            echo "✅ **Quality Assessment**: Text extraction quality analysis" >> $GITHUB_STEP_SUMMARY
            echo "✅ **Memory Profiling**: Peak memory usage tracking" >> $GITHUB_STEP_SUMMARY
            echo "✅ **ALL File Sizes**: Including huge documents (>10MB)" >> $GITHUB_STEP_SUMMARY
            echo "✅ **Comprehensive Coverage**: All supported document formats" >> $GITHUB_STEP_SUMMARY
            echo "✅ **Performance Metrics**: Speed, CPU, memory analysis" >> $GITHUB_STEP_SUMMARY

          else
            echo "⚠️ **No benchmark results directory found**" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📋 **All reports, visualizations, and documentation generated from available results**" >> $GITHUB_STEP_SUMMARY

      - name: Upload Raw Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-benchmark-results-${{ github.run_id }}
          path: results*/
          retention-days: 90

      - name: Upload Aggregated Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aggregated-results-${{ github.run_id }}
          path: aggregated-results/
          retention-days: 90

      - name: Upload Documentation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-documentation-${{ github.run_id }}
          path: docs-generated/
          retention-days: 90

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comprehensive-reports-${{ github.run_id }}
          path: final-reports/
          retention-days: 90

      - name: Upload Visualizations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-visualizations-${{ github.run_id }}
          path: final-visualizations/
          retention-days: 90

      - name: Upload Quality Analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-analysis-${{ github.run_id }}
          path: quality-analysis/
          retention-days: 90
