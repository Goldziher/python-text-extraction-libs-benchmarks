site_name: Python Text Extraction Benchmarks 2025
site_description: Comprehensive performance analysis of Python text extraction frameworks
site_url: https://benchmarks.kreuzberg.dev
site_author: Kreuzberg Contributors
repo_name: Goldziher/python-text-extraction-libraries-benchmarks-2025
repo_url: https://github.com/Goldziher/python-text-extraction-libraries-benchmarks-2025
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2025 Kreuzberg Contributors

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: lime
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: lime
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    - announce.dismiss
  icon:
    repo: fontawesome/brands/github
  language: en

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      linenums: true
      use_pygments: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - toc:
      permalink: true
      toc_depth: 3

plugins:
  - search
  - minify:
      minify_html: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Goldziher/python-text-extraction-libraries-benchmarks-2025
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/kreuzberg/

nav:
  - Home: index.md

  - Results Overview:
      - Summary Dashboard: results/overview.md
      - By File Type:
          - results/by-file-type/index.md
          - PDF Documents: results/by-file-type/pdf.md
          - Word Documents: results/by-file-type/docx.md
          - Spreadsheets: results/by-file-type/spreadsheets.md
          - Images: results/by-file-type/images.md
          - Web Documents: results/by-file-type/web.md
          - Data Formats: results/by-file-type/data.md
      - By File Size:
          - results/by-file-size/index.md
          - Tiny (<100KB): results/by-file-size/tiny.md
          - Small (100KB-1MB): results/by-file-size/small.md
          - Medium (1MB-10MB): results/by-file-size/medium.md
          - Large (10MB-50MB): results/by-file-size/large.md
          - Huge (>50MB): results/by-file-size/huge.md
      - By Framework:
          - results/by-framework/index.md
          - Kreuzberg: results/by-framework/kreuzberg.md
          - Unstructured: results/by-framework/unstructured.md
          - MarkItDown: results/by-framework/markitdown.md
          - Extractous: results/by-framework/extractous.md
          - Docling: results/by-framework/docling.md

  - Methodology:
      - Benchmarking Process: methodology/benchmarking.md
      - Metrics Explained: methodology/metrics.md
      - Quality Assessment: methodology/quality.md

  - Raw Data:
      - CSV Downloads: raw-data/downloads.md
